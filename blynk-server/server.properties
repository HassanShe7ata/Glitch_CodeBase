# Local Blynk Legacy server configuration (LAN-only)
# Place this file next to server.jar.

# Default admin account (change before first login)
admin.email=admin@blynk.local
admin.pass=change_me

# Ports
http.port=8080
https.port=9443

# Data and logs
data.folder=./data
logs.folder=./logs

# Recommended to avoid host resolution issues on LAN
server.host=192.168.5.1

# Admin UI access control (adjust if you want to restrict)
allowed.administrator.ips=0.0.0.0/0,::/0
