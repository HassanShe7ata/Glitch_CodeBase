[platformio]
src_dir = .

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:base]
build_src_filter = +<basewithBlynk.ino> -<ArmwithBlynk.ino> -<firmware/> -<dashboard/> -<get_mac_address.cpp>
lib_deps =
    blynkkk/Blynk@^1.3.2

[env:arm]
build_src_filter = +<ArmwithBlynk.ino> -<basewithBlynk.ino> -<firmware/> -<dashboard/> -<get_mac_address.cpp>
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.1

[env:mac]
board = esp32-s3-devkitc-1
build_src_filter = +<get_mac_address.cpp> -<basewithBlynk.ino> -<ArmwithBlynk.ino> -<firmware/> -<dashboard/>

