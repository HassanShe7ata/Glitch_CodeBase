[platformio]
src_dir = .

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:base]
build_src_filter = -<*> +<base.cpp>
upload_port = COM15
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    electroniccats/MPU6050@^1.3.1
    links2004/WebSockets@^2.6.0

[env:arm]
build_src_filter = -<*> +<arm/arm.cpp>
upload_port = COM6
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.1
    links2004/WebSockets@^2.6.0

[env:mac]
board = esp32-s3-devkitc-1
build_src_filter = -<*> +<get_mac_address.*>
